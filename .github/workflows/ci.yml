name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Pruebas en un navegador real con vídeos sintéticos generados con ffmpeg
    # (tests/e2e/). Corren en paralelo a «comprobar».
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Los vídeos sintéticos tardan unos 4 min en generarse (VP9): se guardan entre
      # ejecuciones y solo se rehacen si cambia su generador (tests/e2e/videos.mjs).
      - id: videos
        uses: actions/cache@v4
        with:
          path: /tmp/dualkinema-e2e-v*
          key: videos-e2e-${{ hashFiles('tests/e2e/videos.mjs') }}
      - if: steps.videos.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
