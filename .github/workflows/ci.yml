name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # El relé de salas (senal/) de verdad en local con wrangler dev (workerd viene con npm ci).
      - run: npm run test:senal
      - run: npm run build

  # Si un PR solo cambia documentación (docs/ o archivos .md), las e2e no hacen falta: se saltan (en `main`, siempre).
  cambios:
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.mira.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: mira
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "codigo=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    # Pruebas en un navegador real con vídeos sintéticos generados con ffmpeg
    # (tests/e2e/). Corren en paralelo a «comprobar».
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    # La batería pasó de 15 min en el runner con las pruebas de grabar de la fase 4 (en local, 7 min).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Los vídeos sintéticos tardan unos 4 min en generarse (VP9): se guardan entre
      # ejecuciones y solo se rehacen si cambia su generador (tests/e2e/videos.mjs).
      - id: videos
        uses: actions/cache@v4
        with:
          path: /tmp/dualkinema-e2e-v*
          key: videos-e2e-${{ hashFiles('tests/e2e/videos.mjs') }}
      - if: steps.videos.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
